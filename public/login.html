<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>Log in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap">
<style>
  /* the theme tokens of index.html and setup.html (the shades come from settings.yaml's colour) */
  :root {
    --t50: #f8fafc; --t100: #f1f5f9; --t200: #e2e8f0; --t300: #cbd5e1; --t400: #94a3b8; --t500: #64748b;
    --t600: #475569; --t700: #334155; --t800: #1e293b; --t900: #0f172a; --t950: #020617;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --dash-bg: var(--t800); --dash-text: var(--t200); --dash-muted: var(--t300); --dash-heading: var(--t100);
    --dash-card: rgb(255 255 255 / .05); --dash-block: color-mix(in srgb, var(--t900) 30%, transparent);
    --dash-border: color-mix(in srgb, var(--t200) 20%, transparent); --dash-accent: var(--t400); --dash-on-accent: var(--t950);
    --dash-error: #fb7185;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --dash-bg: var(--t50); --dash-text: var(--t700); --dash-muted: var(--t500); --dash-heading: var(--t800);
    --dash-card: #ffffff; --dash-block: color-mix(in srgb, var(--t200) 50%, transparent);
    --dash-border: color-mix(in srgb, var(--t800) 20%, transparent); --dash-accent: var(--t600); --dash-on-accent: #ffffff;
    --dash-error: #be123c;
  }
  * { box-sizing: border-box; }
  html { background: var(--dash-bg); }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--dash-bg); color: var(--dash-text);
    font: 15px/1.5 Manrope, ui-sans-serif, system-ui, sans-serif; }
  form { width: min(22rem, 100%); padding: 24px; border-radius: 10px; background: var(--dash-card); border: 1px solid var(--dash-border); }
  h1 { margin: 0 0 16px; font-size: 1.25rem; font-weight: 600; color: var(--dash-heading); }
  label { display: block; font-size: .8125rem; color: var(--dash-muted); }
  input[type=password] { display: block; width: 100%; margin: 4px 0 16px; padding: 9px 12px; border-radius: 6px; border: 1px solid var(--dash-border);
    background: var(--dash-block); color: var(--dash-text); font: inherit; }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--dash-accent); outline-offset: 1px; }
  button { width: 100%; padding: 9px 14px; border-radius: 6px; border: 1px solid var(--dash-accent); background: var(--dash-accent);
    color: var(--dash-on-accent); font: inherit; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
  button.secondary { margin-top: 8px; background: transparent; border-color: var(--dash-border); color: var(--dash-text); }
  button[hidden] { display: none; }
  .error { min-height: 1.5em; margin: -8px 0 12px; font-size: .875rem; color: var(--dash-error); }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
</style>
</head>
<body>
<form id="login" method="post" novalidate>
  <h1 id="heading">Log in</h1>
  <input type="text" name="username" autocomplete="username" value="dashboard" class="sr-only" tabindex="-1" aria-hidden="true">
  <label for="password" id="label">Admin password</label>
  <input type="password" id="password" name="password" autocomplete="current-password" required autofocus>
  <p class="error" id="error" role="alert"></p>
  <button type="submit" id="submit">Log in</button>
  <button type="button" id="passkey" class="secondary" hidden>Log in with a passkey</button>
</form>
<script src="common.js"></script>
<script src="login.js"></script>
</body>
</html>
