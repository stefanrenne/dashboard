<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>Log in</title>
<link rel="stylesheet" href="fonts/manrope.css">
<link rel="stylesheet" href="theme.css">
<style>
  * { box-sizing: border-box; }
  html { background: var(--dash-bg); }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--dash-bg); color: var(--dash-text);
    font: 15px/1.55 Manrope, ui-sans-serif, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  form { width: min(23rem, 100%); padding: 32px; border-radius: var(--radius-l); background: var(--dash-card); border: 1px solid var(--dash-border);
    box-shadow: 0 12px 40px var(--dash-shade); }
  h1 { margin: 0 0 24px; font-size: 1.375rem; font-weight: 700; letter-spacing: -.015em; color: var(--dash-heading); }
  label { display: block; font-size: .8125rem; font-weight: 500; color: var(--dash-text); }
  input[type=password] { display: block; width: 100%; min-height: 40px; margin: 6px 0 16px; padding: 8px 12px; border-radius: var(--radius-s);
    border: 1px solid color-mix(in srgb, var(--dash-field) 55%, transparent); background: light-dark(#ffffff, var(--dash-block)); color: var(--dash-heading); font: inherit;
    transition: border-color .12s, box-shadow .12s; }
  input[type=password]:hover { border-color: var(--dash-field); }
  input:focus-visible { outline: none; border-color: var(--dash-accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--dash-accent) 25%, transparent); }
  button:focus-visible { outline: 2px solid var(--dash-accent); outline-offset: 2px; }
  button { width: 100%; min-height: 40px; padding: 9px 14px; border-radius: var(--radius-s); border: 1px solid var(--dash-accent); background: var(--dash-accent);
    color: var(--dash-on-accent); font: inherit; font-size: .9375rem; font-weight: 600; cursor: pointer; transition: filter .12s, background .12s; }
  button:hover:not(:disabled) { filter: brightness(1.08); }
  button:disabled { opacity: .6; cursor: default; }
  button.secondary { margin-top: 8px; background: transparent; border-color: var(--dash-border); color: var(--dash-heading); }
  button.secondary:hover:not(:disabled) { filter: none; background: var(--dash-hover); }
  button[hidden] { display: none; }
  .error { min-height: 1.5em; margin: -8px 0 12px; font-size: .875rem; color: var(--dash-error); }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  @media (pointer: coarse) { input[type=password], button { min-height: 44px; } }
  @media (prefers-reduced-motion: reduce) { input, button { transition: none; } }
  @media (prefers-contrast: more) { input[type=password], button.secondary, form { border-color: var(--dash-field); } }
</style>
</head>
<body>
<form id="login" method="post" novalidate>
  <h1 id="heading">Log in</h1>
  <input type="text" name="username" autocomplete="username" value="dashboard" class="sr-only" tabindex="-1" aria-hidden="true">
  <label for="password" id="label">Admin password</label>
  <input type="password" id="password" name="password" autocomplete="current-password" required autofocus>
  <p class="error" id="error" role="alert"></p>
  <button type="submit" id="submit">Log in</button>
  <button type="button" id="passkey" class="secondary" hidden>Log in with a passkey</button>
</form>
<script src="common.js"></script>
<script src="login.js"></script>
</body>
</html>
