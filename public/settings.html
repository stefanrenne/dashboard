<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>Settings</title>
<link rel="stylesheet" href="fonts/manrope.css">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="forms.css">
<style>
  body { overflow-x: clip; }
  main { max-width: 52rem; margin: 0 auto; padding: 0 16px 64px; }
  main:has(.saved) { padding-bottom: 0; } /* the save bar ends the page, with nothing below it */
  label > .hint { display: block; margin-top: 4px; font-size: .8125rem; color: var(--dash-muted); }
  label > .hint.error { color: var(--dash-error); }
  .card header .order { display: flex; gap: 4px; margin-inline-start: auto; }
  .card header .order button { min-width: 32px; min-height: 32px; padding: 4px 8px; }
  .item.line { padding: 8px 0; }
  .item.line code { font: .875rem ui-monospace, Menlo, Consolas, monospace; color: var(--dash-text); overflow-wrap: anywhere; }
  .item.line { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  section.panel { margin-bottom: 16px; }
  fieldset.ask { margin: 16px 0 0; padding: 0; border: 0; min-width: 0; }
  fieldset.ask > legend { padding: 0; font-weight: 600; color: var(--dash-heading); }
  .panel hr { margin: 20px 0 16px; border: 0; border-top: 1px solid var(--dash-border); }
  /* the header and the save bar stick to the edges; the page shows through them, blurred */
  .top, .saved { position: sticky; z-index: 2; display: flex; align-items: center; gap: 12px; padding-block: 12px;
    /* full page width; the padding keeps the buttons on the column of the page */
    margin-inline: calc(50% - 50vw); padding-inline: calc(50vw - 50%);
    background: color-mix(in srgb, var(--dash-bg) 30%, transparent);
    -webkit-backdrop-filter: blur(12px) saturate(1.5); backdrop-filter: blur(12px) saturate(1.5); }
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) { .top, .saved { background: var(--dash-bg); } }
  .top { top: 0; margin-bottom: 16px; border-bottom: 1px solid var(--dash-border); }
  .top h1 { margin: 0; font-size: 1.35rem; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .back { flex: none; display: inline-flex; align-items: center; padding: 7px 14px; border-radius: 6px; border: 1px solid var(--dash-field);
    background: var(--dash-card); color: var(--dash-heading); font-weight: 600; text-decoration: none; }
  .back:hover { border-color: var(--dash-accent); }
  .back:focus-visible { outline: 2px solid var(--dash-accent); outline-offset: 1px; }
  .saved { bottom: 0; justify-content: flex-end; }
  nav.sections { display: flex; flex-wrap: wrap; gap: 8px 20px; margin: 0 0 16px; }
  .nav-group { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
  .nav-title { margin-inline-end: 4px; font-size: .75rem; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--dash-muted); }
  .nav-choose { display: none; }
  @media (pointer: coarse) {
    nav.sections a, .back, .card header .order button, header.group .order button { min-height: 44px; min-width: 44px; }
  }
  @media (max-width: 40rem) {
    .nav-group { display: none; }
    .nav-choose { display: block; flex: 1 1 100%; }
  }
  nav.sections a { display: inline-flex; align-items: center; min-height: 32px; padding: 4px 12px; border-radius: 999px;
    background: var(--dash-card); color: var(--dash-text); font-size: .875rem; text-decoration: none; }
  nav.sections a:hover { color: var(--dash-heading); }
  nav.sections a[aria-current="page"] { background: var(--dash-accent); color: var(--dash-on-accent); font-weight: 600; }
  nav.sections a:focus-visible { outline: 2px solid var(--dash-accent); outline-offset: 1px; }
  textarea.code { display: block; width: 100%; min-height: 24rem; margin: 12px 0; resize: vertical; tab-size: 2;
    font: .8125rem/1.5 ui-monospace, Menlo, Consolas, monospace; white-space: pre; overflow: auto; }
  #file-choose { display: block; width: 100%; margin-top: 4px; }
  .row.mode { justify-content: flex-end; margin: 0 0 12px; }
  header.group { display: flex; flex-wrap: wrap; align-items: end; gap: 8px 12px; margin-bottom: 8px; }
  header.group > label { flex: 1 1 14rem; }
  header.group .order { display: flex; gap: 4px; margin-inline-start: auto; }
  header.group .order button { min-width: 32px; min-height: 32px; padding: 4px 8px; }
  .icon-field { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .icon-field > input { flex: 1 1 auto; width: auto; margin: 0; }
  .icon-preview { flex: none; display: grid; place-items: center; width: 32px; height: 32px; border-radius: 6px; background: var(--dash-block); }
  .icon-preview img { width: 24px; height: 24px; object-fit: contain; }
  .icon-preview .mask { width: 24px; height: 24px; background: var(--dash-heading); mask-size: contain; mask-repeat: no-repeat; mask-position: center;
    -webkit-mask-size: contain; -webkit-mask-repeat: no-repeat; -webkit-mask-position: center; }
  section.nested { margin: 4px 0; padding: 12px 0 4px; padding-inline-start: 14px; border-inline-start: 2px solid var(--dash-border); }
</style>
</head>
<body>
<main>
  <header class="top">
    <a href="./" id="back" class="back">← Dashboard</a>
    <h1 id="heading">Settings</h1>
  </header>
  <div id="panel"><p class="muted">…</p></div>
</main>
<script src="common.js"></script>
<script src="settings.js"></script>
</body>
</html>
