<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>Settings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap">
<style>
  /* The theme tokens of index.html (the shades --t50 … --t950 come from the chosen colour). */
  :root {
    --t50: #f8fafc; --t100: #f1f5f9; --t200: #e2e8f0; --t300: #cbd5e1; --t400: #94a3b8; --t500: #64748b;
    --t600: #475569; --t700: #334155; --t800: #1e293b; --t900: #0f172a; --t950: #020617;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --dash-bg: var(--t800); --dash-text: var(--t200); --dash-muted: var(--t300); --dash-heading: var(--t100);
    --dash-card: rgb(255 255 255 / .05); --dash-block: color-mix(in srgb, var(--t900) 30%, transparent);
    --dash-border: color-mix(in srgb, var(--t200) 20%, transparent); --dash-accent: var(--t400); --dash-on-accent: var(--t950);
    --dash-ok: #34d399; --dash-warn: #fbbf24; --dash-error: #fb7185;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --dash-bg: var(--t50); --dash-text: var(--t700); --dash-muted: var(--t500); --dash-heading: var(--t800);
    --dash-card: #ffffff; --dash-block: color-mix(in srgb, var(--t200) 50%, transparent);
    --dash-border: color-mix(in srgb, var(--t800) 20%, transparent); --dash-accent: var(--t600); --dash-on-accent: #ffffff;
    --dash-ok: #047857; --dash-warn: #92400e; --dash-error: #be123c;
  }
  * { box-sizing: border-box; }
  html { background: var(--dash-bg); }
  body { margin: 0; overflow-x: clip; min-height: 100vh; background: var(--dash-bg); color: var(--dash-text);
    font: 15px/1.5 Manrope, ui-sans-serif, system-ui, sans-serif; transition: background .2s, color .2s; }
  main { max-width: 52rem; margin: 0 auto; padding: 0 16px 64px; }
  main:has(.saved) { padding-bottom: 0; } /* the save bar ends the page, with nothing below it */
  h1 { margin: 0 0 4px; font-size: 1.6rem; font-weight: 700; color: var(--dash-heading); }
  h2 { margin: 0 0 4px; font-size: 1.15rem; font-weight: 600; color: var(--dash-heading); }
  p { margin: 0 0 12px; }
  .muted { color: var(--dash-muted); font-size: .875rem; }
  a { color: var(--dash-accent); }
  .steps { display: flex; flex-wrap: wrap; gap: 4px; margin: 20px 0 16px; padding: 0; list-style: none; }
  .steps li { padding: 4px 12px; border-radius: 999px; font-size: .8125rem; color: var(--dash-muted); background: var(--dash-card); }
  .steps li[aria-current="step"] { background: var(--dash-accent); color: var(--dash-on-accent); font-weight: 600; }
  .steps li.done { color: var(--dash-text); }
  .panel { padding: 20px; border-radius: 8px; background: var(--dash-card); border: 1px solid var(--dash-border); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr)); gap: 12px 16px; margin: 12px 0; }
  label { display: block; font-size: .8125rem; color: var(--dash-muted); }
  label > input, label > select, label > textarea { display: block; width: 100%; margin-top: 4px; }
  input[type=text], input[type=url], input[type=password], input[type=number], select, textarea {
    padding: 7px 10px; border-radius: 6px; border: 1px solid var(--dash-border); background: var(--dash-block);
    color: var(--dash-text); font: inherit; min-width: 0; }
  input:focus-visible, select:focus-visible, button:focus-visible, textarea:focus-visible { outline: 2px solid var(--dash-accent); outline-offset: 1px; }
  .check { display: flex; align-items: center; gap: 8px; color: var(--dash-text); font-size: .9375rem; }
  .check > input { display: inline-block; width: auto; margin: 0; }
  .choice { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--dash-border); color: var(--dash-text); font-size: .9375rem; cursor: pointer; }
  .choice:has(input:checked) { border-color: var(--dash-accent); }
  .choice > input { display: inline-block; width: auto; margin: 4px 0 0; }
  .choice .hint { font-size: calc(.9375rem - 2px); color: var(--dash-muted); }
  label > .hint { display: block; margin-top: 4px; font-size: .8125rem; color: var(--dash-muted); }
  .badge { margin-inline-start: 8px; padding: 1px 8px; border-radius: 999px; font-size: .75rem; font-weight: 600; background: color-mix(in srgb, var(--dash-ok) 18%, transparent); color: var(--dash-ok); }
  button { font: inherit; cursor: pointer; padding: 7px 14px; border-radius: 6px; border: 1px solid var(--dash-border);
    background: var(--dash-block); color: var(--dash-text); }
  button.primary { background: var(--dash-accent); border-color: var(--dash-accent); color: var(--dash-on-accent); font-weight: 600; }
  button.link { border: 0; background: none; padding: 0; color: var(--dash-accent); text-decoration: underline; }
  button:disabled { opacity: .5; cursor: default; }
  .actions { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; margin-top: 20px; }
  .actions .right { display: flex; gap: 8px; margin-inline-start: auto; }
  .swatches { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .swatch { width: 28px; height: 28px; padding: 0; border-radius: 50%; border: 2px solid transparent; }
  .swatch[aria-pressed="true"] { border-color: var(--dash-text); }
  .cards { display: grid; gap: 10px; margin: 12px 0; }
  .card { padding: 12px 14px; border-radius: 8px; background: var(--dash-block); border: 1px solid transparent; }
  .card.on { border-color: var(--dash-accent); }
  .card.invalid { border-color: var(--dash-error); }
  .card header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
  .card header .check { font-weight: 600; flex: 0 0 auto; }
  .card .image { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .75rem; color: var(--dash-muted); overflow-wrap: anywhere; }
  .card .body { margin-top: 10px; }
  .card details { margin-top: 8px; }
  .card summary { cursor: pointer; font-size: .8125rem; color: var(--dash-muted); }
  .result { font-size: .8125rem; margin-inline-start: 8px; }
  .ok { color: var(--dash-ok); } .warn { color: var(--dash-warn); } .error { color: var(--dash-error); }
  ul.plain { margin: 8px 0; padding-inline-start: 20px; }
  pre { margin: 8px 0; padding: 10px 12px; border-radius: 6px; background: var(--dash-block); overflow: auto;
    font: .8125rem/1.5 ui-monospace, Menlo, Consolas, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
  .item { padding: 12px 0; border-top: 1px solid var(--dash-border); }
  .item:first-child { border-top: 0; padding-top: 0; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; margin-top: 8px; }
  .row label { flex: 1 1 14rem; }
  h2:focus { outline: none; }
  section.panel { margin-bottom: 16px; }
  fieldset.ask { margin: 16px 0 0; padding: 0; border: 0; min-width: 0; }
  fieldset.ask > legend { padding: 0; font-weight: 600; color: var(--dash-heading); }
  .panel hr { margin: 20px 0 16px; border: 0; border-top: 1px solid var(--dash-border); }
  /* the header and the save bar stick to the edges; the page shows through them, blurred */
  .top, .saved { position: sticky; z-index: 2; display: flex; align-items: center; gap: 12px; padding-block: 12px;
    /* full page width; the padding keeps the buttons on the column of the page */
    margin-inline: calc(50% - 50vw); padding-inline: calc(50vw - 50%);
    background: color-mix(in srgb, var(--dash-bg) 30%, transparent);
    -webkit-backdrop-filter: blur(12px) saturate(1.5); backdrop-filter: blur(12px) saturate(1.5); }
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) { .top, .saved { background: var(--dash-bg); } }
  .top { top: 0; margin-bottom: 16px; border-bottom: 1px solid var(--dash-border); }
  .top h1 { margin: 0; font-size: 1.35rem; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .back { flex: none; display: inline-flex; align-items: center; padding: 7px 14px; border-radius: 6px; border: 1px solid var(--dash-border);
    background: var(--dash-card); color: var(--dash-heading); font-weight: 600; text-decoration: none; }
  .back:hover { border-color: var(--dash-accent); }
  .back:focus-visible { outline: 2px solid var(--dash-accent); outline-offset: 1px; }
  .saved { bottom: 0; justify-content: flex-end; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  @media (prefers-reduced-motion: reduce) { body { transition: none; } }
</style>
</head>
<body>
<main>
  <header class="top">
    <a href="./" id="back" class="back">← Dashboard</a>
    <h1 id="heading">Settings</h1>
  </header>
  <div id="panel" aria-live="polite"><p class="muted">…</p></div>
</main>
<script src="settings.js"></script>
</body>
</html>
