<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>Dashboard setup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="forms.css">
<style>
  main { max-width: 52rem; margin: 0 auto; padding: 32px 16px 64px; }
  .steps { display: flex; flex-wrap: wrap; gap: 4px; margin: 20px 0 16px; padding: 0; list-style: none; }
  .steps li { padding: 4px 12px; border-radius: 999px; font-size: .8125rem; color: var(--dash-muted); background: var(--dash-card); }
  .steps li[aria-current="step"] { background: var(--dash-accent); color: var(--dash-on-accent); font-weight: 600; }
  .steps li.done { color: var(--dash-text); }
</style>
</head>
<body>
<main>
  <h1 id="heading">Set up your dashboard</h1>
  <p class="muted" id="intro"></p>
  <ol class="steps" id="steps" hidden></ol>
  <section class="panel" id="panel"><p class="muted">…</p></section>
</main>
<script src="common.js"></script>
<script src="setup.js"></script>
</body>
</html>
