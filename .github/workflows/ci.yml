name: CI

# Work happens on develop: every push there is tested and published as the image's `develop` tag
# (version develop-<sha>), which takes the widgets collection's develop branch. main only moves
# to develop for a release (a fast-forward), and only a tag vX.Y.Z on main publishes `latest`.
on:
  push:
    branches: [develop, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  # weekly rebuild of the newest release, so security fixes of the base image reach it without
  # a code change
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read
  packages: write

# A new push to a branch or PR cancels its older run. Tags (releases) have a ref of their own, and
# manual and scheduled runs a group of their own, so a push never stops a release or a rebuild.
concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'push' || github.event_name == 'pull_request') && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24" # the same LTS line as the image
          cache: npm
      # the tests load every widget from the widgets collection: on develop (a push, or a pull
      # request into it) its develop branch, as a develop image gets it; otherwise its newest
      # release, the one installations get through #latest (and the Pages workflow uses)
      - name: The widgets collection to test with
        id: collection
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEVELOP: ${{ github.ref == 'refs/heads/develop' || github.base_ref == 'develop' }}
        run: |
          if [ "$DEVELOP" = true ]; then echo "tag=develop" >> "$GITHUB_OUTPUT"
          else echo "tag=$(gh release view --repo stefanrenne/dashboard-widgets --json tagName --jq .tagName)" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v7
        with:
          repository: stefanrenne/dashboard-widgets
          ref: ${{ steps.collection.outputs.tag }}
          path: collection
      - run: npm ci --no-audit --no-fund
      - run: npm test
        env:
          DASHBOARD_COLLECTION_DIR: collection

  # A push to main and a pull request build and smoke-test the image without pushing it: an update
  # of the build actions or the base image is tested before a release. Releases and develop are pushed.
  # Whether the image changes. A push to a branch that touches only docs, scripts, tests, examples
  # or Markdown (none of them matters in the image, see .dockerignore) skips the image build.
  # Tags, runs by hand, the weekly rebuild and pull requests always build.
  changes:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.files.outputs.image }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BEFORE: ${{ github.event.before }}
        run: |
          image=true
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/* && -n "$BEFORE" && "$BEFORE" != 0000000000000000000000000000000000000000 ]]; then
            # the compare API lists at most 300 files; more counts as a change to the image
            if files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$GITHUB_SHA" --jq 'if (.files | length) >= 300 then "many files" else .files[].filename end'); then
              if [ -n "$files" ] && ! grep -qvE '^(docs|scripts|tests|examples)/|\.md$' <<<"$files"; then
                image=false
                echo "only docs, scripts, tests, examples or Markdown changed: no image"
              fi
            fi
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"

  image:
    needs: [test, changes]
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.version.outputs.release }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags and main: only a release commit on main is published
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      # Releases are published as `latest`, `X.Y.Z` and `X.Y`: a tag vX.Y.Z on a commit on main,
      # a run by hand on main that releases package.json's version (unless released already),
      # and the weekly rebuild of the newest release. A push to develop (or a run by hand there;
      # dependabot-automerge.yml starts those) is published as `develop` only, version
      # develop-<short sha>. Every other build (a push to main, a pull request) is tested, not
      # pushed, as main-<short sha>.
      - id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="main-${GITHUB_SHA::7}"; rel=false; publish=false; channel=release
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; rel=true; publish=true
          elif [[ "$GITHUB_REF" == refs/heads/develop && ( "$GITHUB_EVENT_NAME" == push || "$GITHUB_EVENT_NAME" == workflow_dispatch ) ]]; then
            v="develop-${GITHUB_SHA::7}"; publish=true; channel=develop
          elif [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_REF" == refs/heads/main ]]; then
            pkg=$(node -p "require('./package.json').version")
            if gh release view "v$pkg" >/dev/null 2>&1; then echo "v$pkg is released already: nothing to publish"
            else v="$pkg"; rel=true; publish=true; fi
          elif [[ "$GITHUB_EVENT_NAME" == schedule ]]; then
            # the newest release again, with the base image's security fixes
            tag=$(gh release view --json tagName --jq .tagName)
            git checkout -q "$tag"; v="${tag#v}"; publish=true; echo "rebuilding $tag"
          fi
          if [ "$channel" = release ] && [ "$publish" = true ] && ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$v is not a commit on main: only releases from main are published"; exit 1
          fi
          { echo "version=$v"; echo "release=$rel"; echo "publish=$publish"; echo "channel=$channel"; echo "minor=${v%.*}"; } >> "$GITHUB_OUTPUT"
      - name: Build for the smoke test (amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          pull: true
          load: true
          tags: dashboard:ci
          build-args: VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run -d --name hd -p 3000:3000 dashboard:ci
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:3000/api/health && break; sleep 1; done
          curl -fs http://127.0.0.1:3000/api/health | grep -q '"version":"${{ steps.version.outputs.version }}"'
          curl -fs http://127.0.0.1:3000/api/layout | grep -q '"groups"'
          curl -fs http://127.0.0.1:3000/ | grep -q '<title>'
          docker logs hd
      - uses: docker/login-action@v4
        if: steps.version.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # a release: latest, X.Y.Z and X.Y; develop: only `develop`
          tags: |
            type=raw,value=latest,enable=${{ steps.version.outputs.channel == 'release' }}
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.channel == 'release' }}
            type=raw,value=${{ steps.version.outputs.minor }},enable=${{ steps.version.outputs.channel == 'release' }}
            type=raw,value=develop,enable=${{ steps.version.outputs.channel == 'develop' }}
      # every build checks that arm64 builds too; only a release or develop is pushed
      - name: Build (amd64, arm64) and push a release or develop
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          pull: true
          push: ${{ steps.version.outputs.publish == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha

  # A tag v1.2.3 becomes a GitHub release with that version's section of CHANGELOG.md. Run by
  # hand on main with a version not released yet, it creates the tag on that commit.
  release:
    needs: image
    if: needs.image.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Release notes from CHANGELOG.md
        run: |
          version="${{ needs.image.outputs.version }}"
          echo "TAG=v$version" >> "$GITHUB_ENV"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "::error::CHANGELOG.md has no section for $version"; exit 1; fi
          printf '\n```bash\ndocker pull ghcr.io/%s:%s\n```\n' "$GITHUB_REPOSITORY" "$version" >> notes.md
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # a pushed tag must exist; by hand, the release creates the tag on this commit
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then target=(--target "$GITHUB_SHA"); else target=(--verify-tag); fi
          gh release create "$TAG" --title "$TAG" --notes-file notes.md "${target[@]}"
