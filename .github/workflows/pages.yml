name: Pages

# The documentation site (https://stefanrenne.github.io/homelab-dashboard/): docs/ and a page
# per widget, with an example image (of the widgets collection at its newest release), built with
# Jekyll and the just-the-docs theme (docs/_config.yml).
on:
  push:
    branches: [main]
    paths: [docs/**, scripts/pages.sh, scripts/pages-widgets.mjs, scripts/widget-images.mjs, .github/workflows/pages.yml]
  workflow_dispatch:
  # picks up a new release of the widgets collection
  schedule:
    - cron: "41 5 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --omit=dev --no-audit --no-fund
      # for the widget images (scripts/widget-images.mjs); not in package.json on purpose
      - run: npm install --no-save --no-audit --no-fund playwright
      # Chromium is cached per Playwright version; the system libraries it needs come from apt
      - id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Newest release of the widgets collection
        id: collection
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "tag=$(gh release view --repo stefanrenne/homelab-dashboard-widgets --json tagName --jq .tagName)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: stefanrenne/homelab-dashboard-widgets
          ref: ${{ steps.collection.outputs.tag }}
          path: collection
      - run: scripts/pages.sh site-src "$GITHUB_REPOSITORY" collection "${{ steps.collection.outputs.tag }}"
      # every code block through Rouge, at the version GitHub Pages highlights with: a block it
      # marks red fails the build (the runner has Ruby)
      - name: Code blocks highlight without errors
        run: |
          gem install --user-install --no-document rouge -v 3.30.0
          ruby scripts/check-highlight.rb site-src
      - uses: actions/configure-pages@v6
      - uses: actions/jekyll-build-pages@v1
        with:
          source: site-src
          destination: _site
      - uses: actions/upload-pages-artifact@v5

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
