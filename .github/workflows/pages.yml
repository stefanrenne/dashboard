name: Pages

# The documentation site (https://getdashboard.dev/): docs/ and a page
# per widget, with an example image (of the widgets collection at its newest release), built with
# Jekyll and the just-the-docs theme (docs/_config.yml).
on:
  push:
    branches: [main]
    paths: [docs/**, scripts/pages.sh, scripts/pages-widgets.mjs, scripts/widget-images.mjs, .github/workflows/pages.yml]
  workflow_dispatch:
  # picks up a new release of the widgets collection
  schedule:
    - cron: "41 5 * * *"

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

# Only main deploys (the github-pages environment allows main only). A scheduled run, or one by
# hand, starts on the default branch (develop): it starts this workflow on main and builds nothing.

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  to-main:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main

  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # the docs of main, the released state
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --omit=dev --no-audit --no-fund
      - name: Newest release of the widgets collection
        id: collection
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "tag=$(gh release view --repo stefanrenne/dashboard-widgets --json tagName --jq .tagName)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: stefanrenne/dashboard-widgets
          ref: ${{ steps.collection.outputs.tag }}
          path: collection
      # The widget images need Chromium and its system libraries. Installing those with apt on the
      # runner hung again and again, so the site is staged in Playwright's own image, which has
      # them; Playwright from npm at the image's version (not in package.json on purpose).
      - name: Site, with the widget images
        timeout-minutes: 20
        env:
          TAG: ${{ steps.collection.outputs.tag }}
        run: |
          v=$(npm view playwright version)
          docker run --rm --ipc=host -u "$(id -u):$(id -g)" -e HOME=/tmp -e REPO="$GITHUB_REPOSITORY" -e TAG -e V="$v" \
            -v "$PWD:/work" -w /work "mcr.microsoft.com/playwright:v$v-noble" \
            sh -c 'npm install --no-save --no-audit --no-fund "playwright@$V" && scripts/pages.sh site-src "$REPO" collection "$TAG"'
          test -n "$(ls site-src/widgets/collection/images)"   # images made, not skipped
      # every code block through Rouge, at the version GitHub Pages highlights with: a block it
      # marks red fails the build (the runner has Ruby)
      - name: Code blocks highlight without errors
        run: |
          gem install --user-install --no-document rouge -v 3.30.0
          ruby scripts/check-highlight.rb site-src
      - uses: actions/configure-pages@v6
      - uses: actions/jekyll-build-pages@v1
        with:
          source: site-src
          destination: _site
      - uses: actions/upload-pages-artifact@v5

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
