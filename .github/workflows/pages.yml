name: Pages

# The documentation site (https://getdashboard.dev/): docs/ and a page
# per widget, with an example image (of the widgets collection at its newest release), built with
# Jekyll and the just-the-docs theme (docs/_config.yml).
on:
  push:
    branches: [main]
    paths: [docs/**, scripts/pages.sh, scripts/pages-widgets.mjs, scripts/widget-images.mjs, .github/workflows/pages.yml]
  workflow_dispatch:
  # picks up a new release of the widgets collection
  schedule:
    - cron: "41 5 * * *"

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

# Only main deploys (the github-pages environment allows main only). A scheduled run, or one by
# hand, starts on the default branch (develop): it starts this workflow on main and builds nothing.

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  to-main:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main

  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # the docs of main, the released state
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --omit=dev --no-audit --no-fund
      # for the widget images (scripts/widget-images.mjs); not in package.json on purpose
      - run: npm install --no-save --no-audit --no-fund playwright
      # Chromium is cached per Playwright version; the system libraries it needs come from apt
      - id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # apt can hang on a slow mirror: short network timeouts with retries, every attempt cut off
      # after 4 minutes and tried again, instead of one attempt that hangs until it fails
      - name: Chromium and its system libraries
        timeout-minutes: 15
        env:
          CACHED: ${{ steps.browsers.outputs.cache-hit }}
        run: |
          printf 'Acquire::Retries "5";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/80-retries >/dev/null
          if [ "$CACHED" = true ]; then step="install-deps chromium"; else step="install --with-deps chromium"; fi
          for attempt in 1 2 3; do
            timeout 240 npx playwright $step && exit 0
            echo "::warning::playwright $step: attempt $attempt failed"
            # a cut-off attempt can leave apt running and holding its lock
            sudo pkill -x apt-get || true
            sudo dpkg --configure -a || true
            sleep $((attempt * 15))
          done
          exit 1
      - name: Newest release of the widgets collection
        id: collection
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "tag=$(gh release view --repo stefanrenne/dashboard-widgets --json tagName --jq .tagName)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: stefanrenne/dashboard-widgets
          ref: ${{ steps.collection.outputs.tag }}
          path: collection
      - run: scripts/pages.sh site-src "$GITHUB_REPOSITORY" collection "${{ steps.collection.outputs.tag }}"
      # every code block through Rouge, at the version GitHub Pages highlights with: a block it
      # marks red fails the build (the runner has Ruby)
      - name: Code blocks highlight without errors
        run: |
          gem install --user-install --no-document rouge -v 3.30.0
          ruby scripts/check-highlight.rb site-src
      - uses: actions/configure-pages@v6
      - uses: actions/jekyll-build-pages@v1
        with:
          source: site-src
          destination: _site
      - uses: actions/upload-pages-artifact@v5

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
